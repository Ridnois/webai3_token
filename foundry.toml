[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 20_000
ffi = false
fs_permissions = []
gas_reports = ["WebAI3Token"]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
quote_style = "double"

